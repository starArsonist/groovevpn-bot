name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q
        env:
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_ADMIN_ID: "1"
          MARZBAN_API_URL: http://marzban.test
          MARZBAN_USERNAME: test
          MARZBAN_PASSWORD: test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/connect/validate.test.mjs
